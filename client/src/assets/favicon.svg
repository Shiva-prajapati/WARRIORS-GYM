<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241a1a"/>
      <stop offset="60%" stop-color="#141111"/>
      <stop offset="100%" stop-color="#0a0808"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="50%" stop-color="#c8cdd6"/>
      <stop offset="100%" stop-color="#7a8291"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3333"/>
      <stop offset="100%" stop-color="#b81414"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3f47"/>
      <stop offset="100%" stop-color="#16181c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#2e2626" stroke-width="8"/>

  <!-- Crossed Barbells Behind Shield -->
  <g stroke="#1a1c20" stroke-width="4" filter="url(#glow)">
    <!-- Bar 1 (NW to SE) -->
    <line x1="80" y1="80" x2="432" y2="432" stroke="#9da3af" stroke-width="18" stroke-linecap="round"/>
    <!-- Weight Plates Left Top -->
    <rect x="74" y="60" width="16" height="60" rx="3" fill="url(#redAccent)" transform="rotate(45 82 90)"/>
    <rect x="94" y="70" width="14" height="40" rx="2" fill="#525866" transform="rotate(45 101 90)"/>
    <!-- Weight Plates Right Bottom -->
    <rect x="422" y="408" width="16" height="60" rx="3" fill="url(#redAccent)" transform="rotate(45 430 438)"/>
    <rect x="404" y="418" width="14" height="40" rx="2" fill="#525866" transform="rotate(45 411 438)"/>

    <!-- Bar 2 (NE to SW) -->
    <line x1="432" y1="80" x2="80" y2="432" stroke="#9da3af" stroke-width="18" stroke-linecap="round"/>
    <!-- Weight Plates Right Top -->
    <rect x="422" y="60" width="16" height="60" rx="3" fill="url(#redAccent)" transform="rotate(-45 430 90)"/>
    <rect x="404" y="70" width="14" height="40" rx="2" fill="#525866" transform="rotate(-45 411 90)"/>
    <!-- Weight Plates Left Bottom -->
    <rect x="74" y="408" width="16" height="60" rx="3" fill="url(#redAccent)" transform="rotate(-45 82 438)"/>
    <rect x="94" y="418" width="14" height="40" rx="2" fill="#525866" transform="rotate(-45 101 438)"/>
  </g>

  <!-- Warrior Crest / Shield Outer Layer -->
  <path d="M 256 100
           C 340 100, 390 135, 390 190
           C 390 320, 256 425, 256 425
           C 256 425, 122 320, 122 190
           C 122 135, 172 100, 256 100 Z"
        fill="url(#metalDark)" stroke="url(#shieldGrad)" stroke-width="14" stroke-linejoin="round"/>

  <!-- Inner Bevel Accent -->
  <path d="M 256 122
           C 324 122, 368 152, 368 198
           C 368 305, 256 395, 256 395
           C 256 395, 144 305, 144 198
           C 144 152, 188 122, 256 122 Z"
        fill="#111317" stroke="#ff2222" stroke-width="5"/>

  <!-- Bold Warrior 'W' Emblem in Shield -->
  <path d="M 180 185
           L 214 185
           L 238 290
           L 256 220
           L 274 290
           L 298 185
           L 332 185
           L 292 340
           L 262 340
           L 256 312
           L 250 340
           L 220 340 Z"
        fill="url(#shieldGrad)"/>

  <!-- Central Red Core Slash -->
  <polygon points="256,160 266,220 256,245 246,220" fill="url(#redAccent)"/>

  <!-- Red Crown Accents -->
  <circle cx="256" cy="138" r="8" fill="#ff2222"/>
  <circle cx="218" cy="148" r="5" fill="#ff2222"/>
  <circle cx="294" cy="148" r="5" fill="#ff2222"/>
</svg>